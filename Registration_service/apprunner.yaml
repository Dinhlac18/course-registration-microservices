version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: DB_PATH
      value: /tmp/registrations.db
    - name: STUDENT_SERVICE_URL
      value: "https://YOUR_STUDENT_SERVICE_URL"
    - name: COURSE_SERVICE_URL
      value: "https://YOUR_COURSE_SERVICE_URL"
      